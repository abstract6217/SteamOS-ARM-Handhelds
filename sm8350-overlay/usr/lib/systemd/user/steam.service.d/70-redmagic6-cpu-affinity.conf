# The Frame's steam.service starts games and desktop apps on cpu3-7 (0xf8),
# one A55 and the big cores here. konkrd already moves game threads to the
# big cores (4-7), so don't pin them here as well.
[Service]
Environment=STEAM_LAUNCH_WRAPPER_AFFINITY_LIST=0xff
Environment=STEAM_DESKTOP_APP_AFFINITY_LIST=0xff
